voice_node:
  ros__parameters:
    # Three forms accepted:
    #   1. Built-in name: "alexa", "hey_jarvis", "hey_mycroft", "hey_rhasspy"
    #   2. Bare filename like "hey_chess.onnx" — resolved from the installed
    #      share/chess_tutor/wakewords/ directory. Drop the .onnx file into
    #      src/chess_tutor/wakewords/ and rebuild with colcon.
    #   3. Absolute path to an .onnx file anywhere on disk.
    wakeword_model: "hey_chess.onnx"
    wakeword_threshold: 0.5
    recording_seconds: 10.0
    whisper_model: "base.en"
    whisper_device: "cpu"        # "cuda" if you have an NVIDIA GPU
    whisper_compute_type: "int8"  # int8 = fast on CPU; use "float16" on CUDA
    audio_input_device: -1        # -1 = system default mic

tutor_node:
  ros__parameters:
    # Leave empty to read from $ANTHROPIC_API_KEY env var (recommended).
    anthropic_api_key: ""

puzzle_node:
  ros__parameters:
    # Empty -> use the bundled data/puzzles.csv from the package share dir.
    puzzles_csv: ""
    # Beginner-friendly band by default. The bundled CSV ranges 400-3073;
    # keeping max_rating low ensures the random/target picker stays gentle.
    min_rating: 400
    max_rating: 1000
    autostart: true
    # ---- Adaptive difficulty ----
    # Starting target rating; clamped into [min_rating, max_rating].
    initial_target_rating: 600
    # Confidence thresholds. Combined confidence below LOW -> easier puzzle;
    # above HIGH -> harder puzzle; in between -> hold steady.
    confidence_low_threshold: 0.4
    confidence_high_threshold: 0.7
    # How much to shift target_rating per puzzle when the threshold is crossed.
    difficulty_step: 75
    # Weight on the external /user_confidence topic (vs LLM-perceived).
    # Combined = external_weight * external + (1 - external_weight) * perceived.
    # If only one signal is available it is used directly.
    external_confidence_weight: 0.5

tts_node:
  ros__parameters:
    # Download from https://github.com/rhasspy/piper/releases — you need both files.
    # Example paths after extracting to ~/.local/share/piper/voices/
    piper_model_path: "/home/khyat/.local/share/piper/voices/en_US-lessac-medium.onnx"
    piper_config_path: "/home/khyat/.local/share/piper/voices/en_US-lessac-medium.onnx.json"
    audio_output_device: -1
